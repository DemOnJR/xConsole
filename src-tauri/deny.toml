# cargo-deny policy. Run:  cargo deny check
# Security advisories + license + source enforcement for the Rust dependency tree.

[advisories]
# Use the RustSec advisory DB. Security-critical advisories fail the build.
version = 2
yanked = "deny"
# Only fail on unmaintained crates we depend on *directly*. The gtk-rs GTK3 stack,
# unic-*, and proc-macro-error are unmaintained but reach us transitively through
# tauri and its Linux webview deps, which we can't unpin.
unmaintained = "workspace"
ignore = [
  # rsa "Marvin Attack" timing side-channel (RUSTSEC-2023-0071). No fixed version
  # exists upstream — the advisory itself says "no fixed upgrade available". rsa
  # reaches us only via russh's `rsa` feature (RSA SSH user/host keys); our
  # app-managed keys are Ed25519 and we connect only to user-configured trusted
  # servers, so practical exposure is low. Revisit when rsa ships a constant-time fix.
  "RUSTSEC-2023-0071",

  # quick-xml denial-of-service pair: quadratic time when checking a start tag for
  # duplicate attribute names (RUSTSEC-2026-0194) and unbounded namespace-declaration
  # allocation in `NsReader` (RUSTSEC-2026-0195). Both are fixed in >=0.41.0.
  #
  # We cannot take that fix: quick-xml reaches us only transitively, and both parents
  # pin an incompatible range —
  #   quick-xml 0.39.x  <- plist 1.9 (`^0.39.2`)          <- tauri-utils <- tauri
  #   quick-xml 0.37.x  <- tauri-winrt-notification 0.7.2 <- notify-rust <- tauri-plugin-notification
  # so `cargo update` cannot reach 0.41 and only a release of `plist` and
  # `tauri-winrt-notification` can resolve it. Forking two crates to dodge a DoS in an
  # XML parser would add more supply-chain risk than it removes.
  #
  # Both advisories are in the *reader*, and require the attacker to control the XML:
  #   - tauri-winrt-notification never parses. It only builds Windows toast XML, and
  #     escapes every interpolated value with `quick_xml::escape::escape` (verified in
  #     its lib.rs), so text we pass through — including agent-derived notification
  #     bodies — becomes escaped character data and cannot introduce attributes or
  #     namespace declarations at all.
  #   - plist parses Apple property lists for bundling. That is our own build
  #     configuration, not input from a user or a network peer, and it is not exercised
  #     at runtime on the platforms this app ships to.
  #
  # Remove both as soon as plist and tauri-winrt-notification ship quick-xml >=0.41.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]

[bans]
# Flag multiple versions of the same crate (bloat / hidden duplicate supply chain).
multiple-versions = "warn"
wildcards = "deny"
allow = []
deny = []

[sources]
# Only allow crates from the official registry; block unknown registries/git sources.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
version = 2
# Permissive licenses acceptable for a desktop app; expand deliberately.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  # Mozilla CA root bundle (webpki-roots / webpki-root-certs) — a permissive data
  # license for the trust-anchor list pulled in via the rustls TLS stack.
  "CDLA-Permissive-2.0",
  # Boost Software License 1.0 — clipboard-win and error-code, which arrive via
  # arboard <- tauri-plugin-clipboard-manager (the terminal copy/paste support).
  # OSI-approved, FSF Free/Libre and GPL-compatible, and *more* permissive than MIT
  # for what we ship: it explicitly waives the attribution requirement for binaries,
  # so it imposes nothing on a compiled desktop app.
  "BSL-1.0",
]
confidence-threshold = 0.9
