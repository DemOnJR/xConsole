name: CI

# Fast PR/push checks. Goal: ~1–2 minutes with a warm cache.
# Heavy supply-chain installs (cargo-audit / deny / cooldown from source)
# live in supply-chain.yml (weekly + manual).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck + unit tests
        # Covers src/ AND plugins/*/src (see tsconfig.json + vitest.config.ts).
        # Both used to be excluded, so ~12k lines of plugin code — including the
        # agent console — shipped with no typecheck and 33 tests that never ran.
        run: pnpm check
      - name: Production build
        # `pnpm check` is tsc --noEmit: it does not catch a broken Vite build
        # (bad asset import, plugin glob, CSS pipeline). Catch that on PR, not
        # in the release workflow.
        run: pnpm build
      - name: Dependency audit
        run: pnpm audit --audit-level moderate

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Cached WebKit / GTK headers (Tauri link)
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: "1"
      - name: Unit tests
        # Default (parallel) test threads on purpose: the tool_cache tests share
        # one process-global CACHE and used to pass only by scheduling luck.
        working-directory: src-tauri
        run: cargo test --locked --lib
